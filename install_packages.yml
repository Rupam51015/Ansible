- name: Install common packages
  hosts: dev
  become: true
  tasks:
    - name: Update packages
      apt:
        update_cache: true
    - name: Install unzip
      apt:
        name: unzip
        state: present
    - name: Install docker
      apt:
        name: docker.io
        state: present
    - name: Install docker compose
      apt:
        name: docker-compose-v2
        state: present
    - name: Add user to group
      user:
        name: ubuntu
        groups: docker
        append: yes

